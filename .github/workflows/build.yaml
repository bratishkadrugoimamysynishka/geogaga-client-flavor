name: 1. Сборка geodata и маршрутизации

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Настройка Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Установка зависимостей
        run: pip install protobuf

      - name: Компиляция Protobuf схемы
        run: protoc --python_out=. tools/router.proto

      - name: Запуск сборщика
        run: python tools/builder.py config.json

      - name: Генерация хэшей SHA256
        run: |
          sha256sum geosite.dat > geosite.dat.sha256
          sha256sum geoip.dat > geoip.dat.sha256

      - name: Генерация конфигураций маршрутизации и ссылок
        shell: bash
        run: |
          set -euo pipefail
          now_epoch="$(date -u +%s)"
          
          mkdir -p routing
          
          for f in routing/*.json; do
            [ -f "$f" ] || continue
            
            filename=$(basename "$f")
            name="${filename%.json}"
            
            echo "Обработка конфигурации: $filename"
            
            tmp="$(mktemp)"
            jq --arg ts "$now_epoch" '.LastUpdated = $ts' "$f" > "$tmp"
            mv "$tmp" "$f"
            
            b64="$(jq -c . "$f" | base64 -w 0)"
            
            echo "${name}://routing/onadd/${b64}" > "routing/${name}.link"
            
            echo "Ссылка routing/${name}.link успешно сгенерирована"
          done

      - name: Фиксация ошибок воркфлоу в лог
        if: failure()
        run: |
          [ -f tools/review.log ] && mv tools/review.log review.log || true
          echo "[$(date -u +'%Y-%m-%d %H:%M:%S')] ОШИБКА: Сбой выполнения шагов сборки в GitHub Actions" >> review.log

      - name: Коммит и пуш лога в ветку main
        if: github.ref_name == 'main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f tools/review.log ]; then
            git add tools.log review.log || true
            git commit -m "chore: обновление build review.log [skip ci]" || echo "Нет изменений в логе для коммита"
            
            git stash --include-untracked
            
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
            
            git stash pop || true
          fi

      - name: Пуш результатов в ветку test
        if: github.ref_name == 'test'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          mkdir -p result
          mv geosite.dat geosite.dat.sha256 geoip.dat geoip.dat.sha256 routing result/ || true
          
          git add result/
          git commit -m "chore: update test results [skip ci]" || echo "No changes to commit"
          git push origin test

      - name: Коммит в ветку release
        if: github.ref_name == 'main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout --orphan tmp-release
          
          git rm -f --cached -r .
          
          git add *.dat *.sha256 routing/*.json routing/*.link
          
          git commit -m "Автоматическое обновление GeoData и конфигураций маршрутизации" || echo "Нет изменений для коммита"
          
          git push origin tmp-release:release --force

      - name: Удаление старого тега/релиза latest
        if: github.ref_name == 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest --cleanup-tag -y || true

      - name: Получение даты
        if: github.ref_name == 'main'
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Создание нового релиза
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ${{ steps.date.outputs.date }}
          files: |
            geosite.dat
            geosite.dat.sha256
            geoip.dat
            geoip.dat.sha256
          prerelease: false
          make_latest: true
