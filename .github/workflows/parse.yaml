name: Парсинг в lst

on:
  schedule:
    - cron: '5 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parse-data:
    runs-on: ubuntu-latest
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Настройка Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Установка зависимостей
        run: pip install protobuf

      - name: Компиляция Protobuf схемы
        run: protoc --python_out=. tools/router.proto

      - name: Запуск скрипта парсера
        run: python tools/parser.py

      - name: Деплой чистых результатов в ветку тестов
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: lists
          folder: parser-tmp
          clean: true
          single-commit: true
