name: Parse to lst

on:
  schedule:
    - cron: '5 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parse-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Protoc & Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          pip install protobuf

      - name: Compile Protobuf Schema
        run: protoc --python_out=. tools/router.proto

      - name: Run Parser Script
        run: python tools/parser.py

      - name: Deploy Clean Results to Test Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: lists
          folder: parser-tmp
          clean: true
          single-commit: true
